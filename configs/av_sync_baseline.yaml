# AV-sync baseline pipeline for Milestone 7 — Level 3 (Colab/GPU).
# Runs: Sunbird ASR -> ForcedAlignment -> Sunbird Translation -> DurationModelling -> DialogueTiming -> MMS-TTS -> VideoMerger
# Replace dummy stages with neural adapters as available; dialogue_timing and video_merger stay deterministic.
name: "av_sync_baseline_sunbird_mms_v1"
description: "M7 Luganda->English AV-sync baseline: Sunbird ASR/translation, MMS-TTS, dialogue timing, video merging."
source_language: "lug"
target_language: "eng"
per_segment_language: false
on_stage_failure: "degrade"

stages:
  - kind: "component"
    key: "sunbird_asr"
    version: "1.0.0"
    params:
      model_name_or_path: "Sunbird/asr-whisper-51-african-languages"
      language: "lug"
  - kind: "component"
    key: "dummy_forced_aligner"
    version: "1.0.0"
  - kind: "component"
    key: "sunbird_translator"
    version: "1.0.0"
    params:
      model_name_or_path: "facebook/nllb-200-distilled-600M"
      source_language: "lug"
      target_language: "eng"
  - kind: "component"
    key: "duration_modeller"
    version: "1.0.0"
  - kind: "component"
    key: "dialogue_timing"
    version: "1.0.0"
    params:
      snap_tolerance: 0.15
      cue_source: "scene_cut"
  - kind: "component"
    key: "mms_tts"
    version: "1.0.0"
    params:
      language: "eng"
      model_name_or_path: "facebook/mms-tts-eng"
  - kind: "component"
    key: "video_merger"
    version: "1.0.0"

metadata:
  environment: "colab_gpu"
  tier: "level_3_research_experiment"
  milestone: "7"
  asr_provider: "sunbird_ai"
  translation_provider: "sunbird_ai"
  tts_provider: "meta_mms"
  av_sync_model: "SyncNet (deterministic fallback in offline)"
