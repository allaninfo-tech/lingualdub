# Runyankole → English baseline pipeline (M8.4) — Level 3 Colab/GPU.
# Uses family-transfer ASR: Sunbird SALT checkpoint covers both Luganda and Runyankole-Rukiga.
# Translation via NLLB nyn_Latn, synthesis via MMS-TTS English (or mms-tts-nyn for native).
name: "runyankole_english_baseline_sunbird_v1"
description: "M8 Runyankole→English dubbing baseline: runyankole_asr (Sunbird SALT) + NLLB translation + MMS-TTS."
source_language: "nyn"
target_language: "eng"
per_segment_language: false
on_stage_failure: "degrade"

stages:
  - kind: "component"
    key: "runyankole_asr"
    version: "1.0.0"
    params:
      model_name_or_path: "Sunbird/asr-whisper-51-african-languages"
      language: "nyn"
      use_neural: true
  - kind: "component"
    key: "dummy_forced_aligner"
    version: "1.0.0"
  - kind: "component"
    key: "hf_translator"
    version: "1.0.0"
    params:
      model_name_or_path: "facebook/nllb-200-distilled-600M"
      source_language: "nyn"
      target_language: "eng"
  - kind: "component"
    key: "duration_modeller"
    version: "1.0.0"
  - kind: "component"
    key: "mms_tts"
    version: "1.0.0"
    params:
      language: "eng"
      model_name_or_path: "facebook/mms-tts-eng"

metadata:
  environment: "colab_gpu"
  tier: "level_3_research_experiment"
  milestone: "8"
  asr_provider: "sunbird_ai"
  translation_provider: "facebook_nllb"
  tts_provider: "meta_mms"
  transfer_basis: "lug->nyn SALT Runyankole-Rukiga 40h"
  audit: "docs/research/runyankole_audit.md"
