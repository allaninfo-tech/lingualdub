# LingualDub — General Speech Dubbing Pipeline Configuration Template
# Works with any low-resource language by specifying source/target language codes and model adapters.

name: "multilingual_speech_dubbing_pipeline"
description: "Generic end-to-end speech dubbing pipeline for low-resource languages."
source_language: "lug"      # Replace with any language code (e.g. "lug", "nyn", "yor", "swa", "ach", "teo")
target_language: "eng"      # Target language for translation/dubbing
per_segment_language: false # Enable for code-switching audio routing
on_stage_failure: "degrade" # "abort", "skip", or "degrade"

stages:
  - kind: "component"
    key: "sunbird_asr"      # or "whisper_asr", "dummy_asr", or custom registered ASR
    version: "1.0.0"
    params:
      model_name_or_path: "Sunbird/asr-whisper-51-african-languages" # Or "openai/whisper-small"
      language: "lug"

  - kind: "component"
    key: "sunbird_translator" # or "hf_translator", "dummy_translator", or custom MT
    version: "1.0.0"
    params:
      model_name_or_path: "facebook/nllb-200-distilled-600M"
      source_language: "lug"
      target_language: "eng"

  - kind: "component"
    key: "mms_tts"           # or "dummy_tts", or custom voice-conditioned TTS
    version: "1.0.0"
    params:
      language: "eng"
      model_name_or_path: "facebook/mms-tts-eng"

metadata:
  environment: "cloud_gpu"
  purpose: "low_resource_speech_dubbing"
